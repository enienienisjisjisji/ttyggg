<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Shorts Studio · 실사형 아바타</title><style>body{font:16px system-ui;background:#080d20;color:#fff;max-width:680px;margin:24px auto;padding:16px}label{display:block;margin:18px 0 8px}input,textarea,select,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #596077;background:#172039;color:white;font:inherit}textarea{min-height:120px}button{background:#2844dc;border:0;margin-top:18px;font-weight:700}button:disabled{opacity:.5}.hint{color:#a9b5ce;font-size:14px}video{width:100%;max-width:380px;display:block;margin:16px auto}a{color:#a4baff}.check{display:flex;gap:10px;align-items:center}.check input{width:auto}</style></head><body><h1>🎬 실사형 여성 아바타</h1><p class="hint">같은 가상 인물의 기준 이미지를 사용해 5~10초 분량의 움직이는 영상 클립을 생성합니다. 현재 버전은 한국어 립싱크와 자동 편집을 지원하지 않습니다.</p><label>관리자 접근 토큰 (Render의 AVATAR_ACCESS_TOKEN)</label><input id="token" type="password" autocomplete="off" placeholder="본인만 아는 비밀 토큰"><label>여성 아바타 기준 이미지 HTTPS URL</label><input id="img" type="url" placeholder="https://.../avatar.png"><p class="hint">공개적으로 접근 가능한, 사용 권한이 있는 가상 인물 이미지를 입력하세요. 이미지가 없으면 먼저 생성해야 합니다.</p><label>동작과 배경 설명</label><textarea id="prompt">The same woman looks at the camera, smiles naturally, makes subtle hand gestures while standing on a modern city street. Cinematic lighting, realistic facial movements, steady camera, vertical composition, no text overlays.</textarea><label>영상 길이</label><select id="duration"><option value="5">5초 (첫 테스트 추천)</option><option value="10">10초</option></select><label class="check"><input type="checkbox" id="approve"> 외부 AI 영상 생성에 유료 크레딧이 청구될 수 있음을 이해하고 이번 생성을 승인합니다.</label><button id="go">실사형 영상 생성 시작</button><p id="status" role="status">준비 완료</p><video id="out" controls playsinline style="display:none"></video><a id="link" target="_blank" rel="noopener" style="display:none">완성된 영상 열기 / 저장</a><p><a href="/">← AI Shorts Studio로 돌아가기</a></p><script>const $=id=>document.getElementById(id);let poll;async function api(url,opts){const r=await fetch(url,opts);const txt=await r.text();let j;try{j=JSON.parse(txt)}catch{throw Error('서버가 JSON 대신 응답했습니다: HTTP '+r.status+' '+txt.slice(0,140))}if(!r.ok)throw Error(j.detail||'HTTP '+r.status);return j} $('go').onclick=async()=>{clearTimeout(poll);$('go').disabled=true;$('status').textContent='작업 제출 중...';try{let j=await api('/api/avatar/start',{method:'POST',headers:{'Content-Type':'application/json','X-Avatar-Token':$('token').value},body:JSON.stringify({image_url:$('img').value,prompt:$('prompt').value,duration:Number($('duration').value),approved_paid_generation:$('approve').checked})});let count=0;async function check(){try{let s=await api('/api/avatar/status/'+encodeURIComponent(j.request_id));$('status').textContent='영상 생성 상태: '+s.status;if(s.status==='COMPLETED'){if(!s.video_url)throw Error('완료되었지만 영상 주소가 없습니다.');$('out').src=s.video_url;$('out').style.display='block';$('link').href=s.video_url;$('link').style.display='block';$('go').disabled=false;return}if(s.status==='FAILED')throw Error(s.details||'영상 생성 실패');if(++count>120)throw Error('조회 제한에 도달했습니다. 다시 상태를 확인하세요.');poll=setTimeout(check,5000)}catch(e){$('status').textContent='오류: '+e.message;$('go').disabled=false}}await check()}catch(e){$('status').textContent='오류: '+e.message;$('go').disabled=false}};</script></body></html>
